<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Saved Resources — StudyHub</title>
  <script>
    (function () {
      try { document.documentElement.dataset.theme = localStorage.getItem("studyhub_theme") || "light"; } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      <h1 style="font:700 1.6rem var(--font-display);margin:.7rem 0 .35rem;">Saved Resources</h1>
