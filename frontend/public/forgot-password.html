<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Forgot your password — StudyHub</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css?v=3" />
  </head>

  <body class="auth-scene auth-scene--reset auth-scene--forgot">
    <main class="shell">
      <section class="brand-panel">
        <div class="brand-mark">
          <span class="brand-mark__glyph" aria-hidden="true">
            <img src="/assets/studyhub-logo.png" alt="" />
          </span>
          <span class="brand-mark__name">StudyHub</span>
        </div>

        <h1>Let's get you back.</h1>
        <p>Reset your password securely.</p>
      </section>

      <section class="auth-card auth-card--narrow">
        <header class="auth-card__head">
          <h2>Forgot password?</h2>
          <p class="auth-card__sub">We'll send a reset code to your email.</p>
        </header>

        <div class="alert" id="form-alert" hidden></div>

        <form id="forgot-form" novalidate>
          <div class="field">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email address"
              autocomplete="email"
              inputmode="email"
              aria-describedby="email-error"
            />
            <span class="field-error" id="email-error" aria-live="polite"></span>
          </div>

          <button type="submit" class="btn btn--primary" id="submit-btn">
            <span class="btn__spinner" aria-hidden="true"></span>
            <span class="btn__label">Send reset code</span>
          </button>
        </form>

        <p class="auth-card__foot">
          Remembered it? <a href="index.html">Back to login</a>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/password.js"></script>
  </body>
</html>
