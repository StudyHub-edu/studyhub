<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="/assets/favicon.png">
  <title>Sign in to StudyHub</title>
    <meta name="description" content="Sign in to StudyHub — your learning, your community, your future." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/auth.css?v=3" />
    <link rel="stylesheet" href="css/password-buddy.css" />
  </head>

  <body class="auth-scene auth-scene--login">
    <main class="shell">
      <section class="brand-panel">
        <div class="brand-mark">
          <span class="brand-mark__glyph" aria-hidden="true">
            <img src="/assets/studyhub-logo.png" alt="" />
          </span>
          <span class="brand-mark__name">StudyHub</span>
        </div>

        <h1>Welcome back.</h1>
        <p>Keep learning with StudyHub.</p>
      </section>

      <section class="auth-card auth-card--narrow">
        <header class="auth-card__head">
          <h2>Sign in</h2>
          <p class="auth-card__sub">Continue to your account.</p>
        </header>

        <div class="alert" id="form-alert" hidden></div>

        <form id="login-form" novalidate autocomplete="on">
          <div class="field">
            <label for="email">Email address</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Enter your email address"
              autocomplete="username"
              inputmode="email"
              aria-describedby="email-error"
            />
            <span class="field-error" id="email-error" aria-live="polite"></span>
          </div>

          <div class="field">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                aria-describedby="password-error"
              />
              <button type="button" class="toggle-password" data-target="password" aria-label="Show password"></button>
            </div>
            <span class="field-error" id="password-error" aria-live="polite"></span>
          </div>

          <div class="row-between">
            <label class="check" for="keep-signed-in" style="margin: 0">
              <input type="checkbox" id="keep-signed-in" checked />
              <span>Keep me signed in</span>
            </label>
            <a href="forgot-password.html">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn--primary" id="submit-btn">
            <span class="btn__spinner" aria-hidden="true"></span>
            <span class="btn__label">Sign in</span>
          </button>
        </form>

        <div class="divider">or</div>

        <!-- Enabled only once the Google provider is configured in Supabase.
             See GOOGLE_PROVIDER_ENABLED in js/login.js. -->
        <button type="button" class="btn btn--ghost" id="google-btn">
          <span class="btn__spinner" aria-hidden="true"></span>
          <svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="#4285F4" d="M23 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.2a5.3 5.3 0 0 1-2.3 3.5v2.9h3.7c2.2-2 3.4-5 3.4-8.6Z" />
            <path fill="#34A853" d="M12 23.5c3.1 0 5.7-1 7.6-2.8l-3.7-2.9c-1 .7-2.3 1.1-3.9 1.1-3 0-5.5-2-6.4-4.7H1.8v3A11.5 11.5 0 0 0 12 23.5Z" />
            <path fill="#FBBC05" d="M5.6 14.2a6.9 6.9 0 0 1 0-4.4v-3H1.8a11.5 11.5 0 0 0 0 10.4l3.8-3Z" />
            <path fill="#EA4335" d="M12 5.5c1.7 0 3.2.6 4.4 1.7l3.3-3.3A11.5 11.5 0 0 0 1.8 6.8l3.8 3C6.5 7.4 9 5.5 12 5.5Z" />
          </svg>
          <span class="btn__label">Continue with Google</span>
        </button>
        <p class="provider-note" id="google-note" hidden>Google sign-in is coming soon.</p>

        <p class="auth-card__foot">
          Don't have an account? <a href="register.html">Create an account</a>
        </p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
    <script src="js/config.js?v=2"></script>
    <script src="js/auth.js?v=5"></script>
    <script src="js/login.js?v=3"></script>
  </body>
</html>
