<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="StudyHub: chat, ask questions and share resources with your classmates and teachers.">
  <meta name="theme-color" content="#080c1b">
  <title>StudyHub</title>
  <link rel="icon" href="/assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/community/css/style.css?v=3">
  <script>
    // Apply the saved (or system) theme before anything is drawn, so there is no flash.
    (function () {
      var saved = null;
      try { saved = localStorage.getItem('sh_theme'); } catch (e) {}
      document.documentElement.dataset.theme = saved || 'light';
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <div id="toasts" aria-live="polite"></div>
  <noscript><p style="padding:2rem;font-family:sans-serif">StudyHub needs JavaScript to run. Please enable it in your browser.</p></noscript>
  <script src="/community/socket.io/socket.io.js"></script>
  <script src="/community/vendor/fullcalendar.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="/js/config.js"></script>
  <script type="module" src="/community/js/app.js?v=15"></script>
</body>
</html>
